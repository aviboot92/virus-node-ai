name: Test Project

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: node:24

    steps:
      - uses: actions/checkout@v4

      - run: npm ci

      # Generate Prisma Client
      - run: npx prisma generate

      # Run tests
      - run: npm test

      # Build TypeScript
      - run: npm run build
